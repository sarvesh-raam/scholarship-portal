{% extends 'layout.html' %}
{% block content %}
<div class="row">
	<div class="col-lg-6 mx-auto py-5">
		<p class="text-muted mb-1">Error {{ code }}</p>
		<h1 class="mb-3">{{ message }}</h1>
		<div class="d-flex gap-2">
			<a href="{{ url_for('index') }}" class="btn btn-primary">Go to home</a>
			<a href="javascript:history.back()" class="btn btn-ghost">Go back</a>
		</div>
	</div>
</div>
{% endblock %}
