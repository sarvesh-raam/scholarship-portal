{% extends 'layout.html' %}
{% block content %}
<style>
	.auth { max-width: 420px; margin: 16px auto 0; }
	.auth h1 { font-size: 28px; margin-bottom: 4px; }
	.pwd-wrap { position: relative; }
	.pwd-wrap .form-control { padding-right: 64px; }
	.pwd-toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); font-size: 13px; padding: 4px 6px; }
	.pwd-toggle:hover { color: var(--ink); }
</style>
<div class="auth">
	<h1>Sign in</h1>
	<p class="text-muted mb-4">Students and aid office staff use the same sign-in.</p>
	<div class="card p-4">
		<form method="post">
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
			<div class="mb-3">
				<label class="form-label" for="email">Email</label>
				<input id="email" class="form-control" type="email" name="email" autocomplete="email" required autofocus />
			</div>
			<div class="mb-4">
				<label class="form-label" for="password">Password</label>
				<div class="pwd-wrap">
					<input id="password" class="form-control" type="password" name="password" autocomplete="current-password" required />
					<button type="button" class="pwd-toggle" id="pwdToggle" aria-controls="password">Show</button>
				</div>
			</div>
			<button class="btn btn-primary w-100" type="submit">Sign in</button>
		</form>
	</div>
	<p class="small text-muted mt-3">New student? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
<script>
document.getElementById('pwdToggle').addEventListener('click', function(){
	const input = document.getElementById('password');
	const show = input.type === 'password';
	input.type = show ? 'text' : 'password';
	this.textContent = show ? 'Hide' : 'Show';
});
</script>
{% endblock %}
