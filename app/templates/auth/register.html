{% extends 'layout.html' %}
{% block content %}
<div class="row">
	<div class="col-md-7 mx-auto">
		<div class="card p-4">
			<h3 class="mb-1">Create a student account</h3>
			<p class="text-muted mb-3">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
			<form method="post">
	<input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
				<div class="row g-3">
					<div class="col-md-6">
						<label class="form-label">Name</label>
						<input class="form-control" name="name" required />
					</div>
					<div class="col-md-6">
						<label class="form-label">Email</label>
						<input class="form-control" type="email" name="email" required />
					</div>
					<div class="col-md-6">
						<label class="form-label">Password</label>
						<input class="form-control" type="password" name="password" minlength="8" autocomplete="new-password" required />
					<div class="form-text text-muted">At least 8 characters.</div>
					</div>
					<div class="col-md-6">
						<label class="form-label">Department</label>
						<input class="form-control" name="department" />
					</div>
				</div>
				<button class="btn btn-primary mt-3" type="submit">Create account</button>
			</form>
		</div>
	</div>
</div>
{% endblock %}
