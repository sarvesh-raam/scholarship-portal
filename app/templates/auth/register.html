{% extends 'layout.html' %}
{% block content %}
<div style="max-width:620px;margin:16px auto 0">
	<h1 style="font-size:28px" class="mb-1">Create a student account</h1>
	<p class="text-muted mb-4">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
	<div class="card p-4">
		<form method="post">
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
			<div class="row g-3">
				<div class="col-md-6">
					<label class="form-label" for="name">Full name</label>
					<input id="name" class="form-control" name="name" autocomplete="name" required />
				</div>
				<div class="col-md-6">
					<label class="form-label" for="email">Email</label>
					<input id="email" class="form-control" type="email" name="email" autocomplete="email" required />
				</div>
				<div class="col-md-6">
					<label class="form-label" for="password">Password</label>
					<input id="password" class="form-control" type="password" name="password" minlength="8" autocomplete="new-password" required />
					<div class="form-text">At least 8 characters.</div>
				</div>
				<div class="col-md-6">
					<label class="form-label" for="department">Department <span class="text-muted fw-normal">(optional)</span></label>
					<input id="department" class="form-control" name="department" />
				</div>
			</div>
			<button class="btn btn-primary mt-4" type="submit">Create account</button>
		</form>
	</div>
</div>
{% endblock %}
