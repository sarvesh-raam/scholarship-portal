{% extends 'layout.html' %}
{% block content %}
<div class="page-head">
	<div>
		<h1>Profile</h1>
		<p>Used to check your eligibility. {{ current_user.email }}</p>
	</div>
</div>
<form method="post" class="card p-4" style="max-width:720px">
	<input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
	<div class="row g-3">
		<div class="col-md-6">
			<label class="form-label" for="name">Full name</label>
			<input id="name" class="form-control" name="name" value="{{ current_user.name }}" required />
		</div>
		<div class="col-md-6">
			<label class="form-label" for="department">Department</label>
			<input id="department" class="form-control" name="department" value="{{ current_user.department or '' }}" />
		</div>
		<div class="col-md-6">
			<label class="form-label" for="cgpa">CGPA</label>
			<input id="cgpa" class="form-control" type="number" step="0.01" min="0" max="10" name="cgpa" value="{{ current_user.cgpa if current_user.cgpa is not none else '' }}" />
			<div class="form-text">On a 10-point scale.</div>
		</div>
		<div class="col-md-6">
			<label class="form-label" for="family_income">Annual family income (₹)</label>
			<input id="family_income" class="form-control" type="number" step="0.01" min="0" name="family_income" value="{{ current_user.family_income if current_user.family_income is not none else '' }}" />
		</div>
	</div>
	<div><button class="btn btn-primary mt-4">Save changes</button></div>
</form>
{% endblock %}
